<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FixCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">FixCare UTM</span>
            <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-body text-center">
                <h2 id="bienvenida">Cargando...</h2>
                <p class="text-muted">Tu rol actual es: <strong id="rolUsuario">...</strong></p>
                <hr>
                <p>Aquí es donde aparecerán los tickets de mantenimiento pronto.</p>
            </div>
        </div>
    </div>

    <script>
        // Verificamos que el usuario realmente tenga un token (Seguridad básica)
        const token = localStorage.getItem('token');
        const nombre = localStorage.getItem('usuario');
        const rol = localStorage.getItem('rol');

        if (!token) {
            // Si no hay token, lo mandamos de vuelta al login
            window.location.href = 'login.html';
        } else {
            // Si hay token, mostramos sus datos
            document.getElementById('bienvenida').textContent = `¡Bienvenido, ${nombre}!`;
            document.getElementById('rolUsuario').textContent = rol;
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
